<body>
<div id="screen-tools">
  <button type="button" id="sample-open">Practice scanning</button>
</div>
<div id="app"></div>
<dialog id="scan-dialog" aria-labelledby="scan-title">
  <div class="scan-toolbar">
    <div><h1 id="scan-title"></h1><p id="scan-instruction">Point the Android scanner at the entire center code.</p></div>
    <button type="button" id="scan-close">Close</button>
  </div>
  <div id="scan-board" aria-label="Card layout for scanning"></div>
  <div class="scan-actions">
    <button type="button" id="scan-remove">Remove one card</button>
  </div>
</dialog>
