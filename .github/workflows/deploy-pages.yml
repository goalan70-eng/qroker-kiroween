name: Publish reviewed QRoker to GitHub Pages

# Manual publication only. The owner must authorize deployment of the reviewed main revision.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the reviewed main revision to the public Pages site'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: qroker-pages
  cancel-in-progress: false

jobs:
  build:
    if: inputs.publish && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out reviewed main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check and verify
        run: |
          npm run typecheck
          npm run typecheck:game
          npm run check:codebook
          npm run test:ci
      - name: Build static app with license and notices
        run: npm run build:submission
      - name: Verify browser flow against production build
        run: |
          npx playwright install --with-deps chromium
          PLAYWRIGHT_PREVIEW=1 npm run test:e2e -- --grep 'one human and three BEGINNER'
      - name: Read existing Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload static app only
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish reviewed static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
