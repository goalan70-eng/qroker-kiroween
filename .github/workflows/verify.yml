name: QRoker verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qroker-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate command-only Kiro Hooks and run automation self-tests
        run: |
          node --check scripts/verify-task.mjs
          node --check scripts/hook-support.mjs
          node --check scripts/automation-hooks.mjs
          node --check scripts/validate-hook-config.mjs
          node scripts/validate-hook-config.mjs
          node --test scripts/automation-hooks.test.mjs
          node --check scripts/openai-review.mjs
          node --test scripts/openai-review.test.mjs
      - name: Type-check project
        run: npm run typecheck
      - name: Type-check browser game
        run: npm run typecheck:game
      - name: Verify frozen optical codebook
        run: npm run check:codebook
      - name: Run full test suite
        run: npm run test:ci
      - name: Build browser application
        run: npm run build
      - name: Install Chromium browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real-browser Playwright regressions
        run: npm run test:e2e
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
